
services:
  localstack:
    image: localstack/localstack:4.10.0
    ports:
      - '4567:4567' # LocalStack Gateway
      - '4610-4659:4610-4659' # external services port range
    env_file:
      - 'compose/aws.env'
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN # Localstack DEBUG Level
      SERVICES: s3,sqs,sns,firehose
      GATEWAY_LISTEN: 0.0.0.0:4567
      EXTERNAL_SERVICE_PORTS_START: 4610
      EXTERNAL_SERVICE_PORTS_END: 4659
    volumes:
      - '${TMPDIR:-/tmp}/localstack:/var/lib/localstack'
      - ./compose/start-localstack-override.sh:/etc/localstack/init/ready.d/start-localstack.sh
    healthcheck:
      test: ['CMD', 'curl', 'localhost:4567/_localstack/health']
      interval: 5s
      start_period: 5s
      retries: 3
    networks:
      - lis_cattle

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6380:6379'
    restart: always
    networks:
      - lis_cattle

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: lis_api_cattle_ddl
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lis_cattle
    networks:
      - lis_cattle
    volumes:
      - postgres-data:/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lis_api_cattle_ddl -d lis_cattle" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  liquibase:
    image: liquibase/liquibase:5.0.1
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - ./changelog:/liquibase/changelog
    command: >
      "/liquibase/liquibase lpm add postgresql || true &&
      /liquibase/liquibase --url=jdbc:postgresql://postgres:5432/lis_cattle --username=lis_api_cattle_ddl --password=postgres --searchPath=/liquibase/changelog --changeLogFile=db.changelog.xml --liquibaseSchemaName=public update --context-filter=default"
    networks:
      - lis_cattle
      
  lis_cattle:
    container_name: lis_cattle
    platform: linux
    build: ./
    ports:
      - '3001:8080'
    links:
      - 'localstack:localstack'
      - 'postgres:postgres'
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_started
      liquibase:
        condition: service_completed_successfully
    env_file:
      - path: 'compose/aws.env'
        required: true
    environment:
      PORT: 8080
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      LOCALSTACK_ENDPOINT: http://localstack:4567
      AWS__ServiceUrl: http://localstack:4567
      AWS__UseLocalStack: "true"
      AWS__SubmissionValidationQueueUrl: "http://localstack:4567/000000000000/submission_validation_queue"
      AWS__SubmissionValidationTopicArn: "arn:aws:sns:eu-west-2:000000000000:submission_validation_topic"
      POSTGRES_URI: http://postgres:5432
      PostgresConfiguration__UseIamAuthentication: "false"
      ConnectionStrings__ReadWritePostgresConnection: "User ID=lis_api_cattle_ddl;Password=postgres;Host=postgres;Database=lis_cattle;"
      ConnectionStrings__ReadOnlyPostgresConnection: "User ID=lis_api_cattle_ddl;Password=postgres;Host=postgres;Database=lis_cattle;"
    networks:
      - lis_cattle

volumes:
  postgres-data:

networks:
  lis_cattle:
    driver: bridge
