name: 'Publish Container Image'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: 'Publish'
    uses: DEFRA/lis-github-actions/.github/workflows/container-publish.yml@be6b83ca7ee5cab10cd4754760312a0cb5099431
    with:
      migrations-path: changelog
    secrets: inherit
