name: 'Publish NuGet Packages'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: 'Publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Publish Container
        uses: DEFRA/lis-github-actions/actions/publish-container@feature/LREG-900-convert-to-actions # temporary branch test
        with:
          version: ${{ github.ref_name }}
          aws-account-id: ${{ secrets.LIS_AWS_ACCOUNT_ID }}
          
      - name: Publish Liquibase
        uses: DEFRA/lis-github-actions/actions/publish-liquibase@feature/LREG-900-convert-to-actions # temporary branch test
        with:
          version: ${{ github.ref_name }}
          aws-account-id: ${{ secrets.LIS_AWS_ACCOUNT_ID }}
