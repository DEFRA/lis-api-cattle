name: 'Prerelease'

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  get-version:
    name: 'Calculate Version'
    uses: DEFRA/lis-github-actions/.github/workflows/version.yml@0.4.0
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      release-type: prerelease

  validate:
    name: 'Validate'
    needs: get-version
    uses: DEFRA/lis-github-actions/.github/workflows/dotnet-service-validate.yml@0.4.0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}
      pre-build-cake-script: ./liquibase.cake
      smoke-postgres: true
      smoke-env: |
        PostgresConfiguration__UseIamAuthentication=false
        ConnectionStrings__ReadWritePostgresConnection=Host=postgres;Port=5432;Database=smoke;Username=smoke;Password=smoke
        ConnectionStrings__ReadOnlyPostgresConnection=Host=postgres;Port=5432;Database=smoke;Username=smoke;Password=smoke
        AWS__EnableBackgroundConsumer=false
        CtsPollingJob__Enabled=false

  sonar-analysis:
    name: 'Sonar Analysis'
    needs: get-version
    uses: DEFRA/lis-github-actions/.github/workflows/dotnet-sonar.yml@0.4.0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      sonar-exclusions: '.github/**,changelog/**,tests/Endpoints/**'
    secrets: inherit

  create-tag:
    name: 'Tag Validated Commit'
    needs: [get-version, validate, sonar-analysis]
    if: needs.sonar-analysis.outputs.quality-gate-status == 'PASSED'
    uses: DEFRA/lis-github-actions/.github/workflows/tag.yml@0.4.0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}
    secrets: inherit
