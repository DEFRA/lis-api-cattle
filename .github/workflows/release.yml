name: 'Release'

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: main-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  get-version:
    name: 'Calculate Stable Version'
    if: github.event.pull_request.merged == true
    uses: DEFRA/lis-github-actions/.github/workflows/version.yml@v0
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      branch: ${{ github.event.pull_request.head.ref }}
      release-type: stable

  validate:
    name: 'Validate Merged Commit'
    needs: get-version
    uses: DEFRA/lis-github-actions/.github/workflows/dotnet-service-validate.yml@v0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      pre-build-cake-script: ./liquibase.cake
      smoke-postgres: true
      smoke-env: |
        PostgresConfiguration__UseIamAuthentication=false
        ConnectionStrings__ReadWritePostgresConnection=Host=postgres;Port=5432;Database=smoke;Username=smoke;Password=smoke
        ConnectionStrings__ReadOnlyPostgresConnection=Host=postgres;Port=5432;Database=smoke;Username=smoke;Password=smoke
        AWS__EnableBackgroundConsumer=false
        CtsPollingJob__Enabled=false

  sonar-analysis:
    name: 'Sonar Analysis'
    needs: [get-version, validate]
    uses: DEFRA/lis-github-actions/.github/workflows/dotnet-sonar.yml@v0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      branch: main
      sonar-exclusions: '.github/**,changelog/**,tests/Endpoints/**'
    secrets: inherit

  create-tag:
    name: 'Tag Main'
    needs: [get-version, validate, sonar-analysis]
    if: needs.sonar-analysis.outputs.quality-gate-status == 'PASSED'
    uses: DEFRA/lis-github-actions/.github/workflows/tag.yml@v0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    secrets: inherit
