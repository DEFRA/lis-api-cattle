name: 'Validate'

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        description: 'Git ref or commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: 'Audit, Format, Lint, Build and Test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Validate Database
        uses: cake-build/cake-action@d218f1133bb74a1df0b08c89cfd8fc100c09e1a0 #v3.0.1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          PACKAGE_VERSION: ${{ inputs.version }}
        with:
          script-path: ./liquibase.cake
          target: Default

      - name: Validate App
        uses: cake-build/cake-action@d218f1133bb74a1df0b08c89cfd8fc100c09e1a0 #v3.0.1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          PACKAGE_VERSION: ${{ inputs.version }}
        with:
          script-path: ./build.cake
          target: Build

  build-image:
    name: 'Build and Test Container Image'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Prepare image metadata
        id: image
        env:
          IMAGE_NAME: ${{ github.event.repository.name }}
          REVISION: ${{ inputs.ref }}
        run: |
          echo "ref=$IMAGE_NAME:build-$REVISION" >> "$GITHUB_OUTPUT"
          echo "artifact=container-image-$REVISION" >> "$GITHUB_OUTPUT"

      - name: Build production image with Cake
        uses: cake-build/cake-action@d218f1133bb74a1df0b08c89cfd8fc100c09e1a0 #v3.0.1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          PACKAGE_VERSION: ${{ inputs.version }}
          IMAGE_NAME: ${{ github.event.repository.name }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          REVISION: ${{ inputs.ref }}
        with:
          script-path: ./build.cake
          target: PackOnly

      - name: Smoke test production image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          network="$(uuidgen)"
          database=''
          container=''

          cleanup() {
            if [[ -n "$container" ]]; then
              docker logs "$container" || true
              docker rm --force "$container" || true
            fi
            if [[ -n "$database" ]]; then
              docker logs "$database" || true
              docker rm --force "$database" || true
            fi
            docker network rm "$network" || true
          }
          trap cleanup EXIT

          docker network create "$network"
          database=$(docker run \
            --detach \
            --network "$network" \
            --network-alias postgres \
            --env POSTGRES_DB=smoke \
            --env POSTGRES_USER=smoke \
            --env POSTGRES_PASSWORD=smoke \
            postgres:16-alpine)

          for attempt in {1..30}; do
            if docker exec "$database" pg_isready --username smoke --dbname smoke >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo 'PostgreSQL did not become ready within 30 seconds.' >&2
              exit 1
            fi
            sleep 1
          done

          container=$(docker run \
            --detach \
            --network "$network" \
            --env ASPNETCORE_URLS=http://+:3000 \
            --env 'ConnectionStrings__ReadWritePostgresConnection=Host=postgres;Port=5432;Database=smoke;Username=smoke;Password=smoke' \
            --env 'ConnectionStrings__ReadOnlyPostgresConnection=Host=postgres;Port=5432;Database=smoke;Username=smoke;Password=smoke' \
            --env AWS__EnableBackgroundConsumer=false \
            --env CtsPollingJob__Enabled=false \
            --publish 3101:3000 \
            "$IMAGE")

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:3101/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo 'Container did not become healthy within 30 seconds.' >&2
          exit 1

      - name: Export tested image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          mkdir container-artifact
          docker image inspect "$IMAGE" --format '{{.Id}}' > container-artifact/image-id.txt
          printf '%s\n' "$IMAGE" > container-artifact/image-ref.txt
          docker save --output container-artifact/image.tar "$IMAGE"

      - name: Upload tested image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.image.outputs.artifact }}
          path: container-artifact
          if-no-files-found: error
          compression-level: 0
