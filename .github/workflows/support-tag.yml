name: 'Create Git Tag'

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        description: 'Exact ref or commit SHA to tag'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  create-tag:
    name: 'Create Git Tag'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LIS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LIS_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Download validated OpenAPI documents
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: openapi-${{ inputs.version }}
        run: |
          gh run download "$RUN_ID" --name "$ARTIFACT_NAME" --dir artifacts/openapi
          test -s artifacts/openapi/v1.json
          test -s artifacts/openapi/v1-internal.json

      - name: Create and push tag
        env:
          TAG: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create release with OpenAPI assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.version }}
        run: |
          options=(--verify-tag --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" \
            artifacts/openapi/v1.json \
            artifacts/openapi/v1-internal.json \
            "${options[@]}"
